<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat Input Helper</title>
<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #2b2b2b;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }
    body {
        padding: 16px;
    }
    .container {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
    }
    .label {
        height: 22px;
        line-height: 22px;
        margin-bottom: 6px;
        font-size: 15px;
        font-weight: 700;
        color: white;
    }
    textarea {
        display: block;
        width: 100%;
        height: 90px;
        margin: 0 0 16px 0;
        padding: 8px;
        resize: none;
        border: 1px solid #666;
        border-radius: 8px;
        background: #333333;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        font-size: 16px;
        line-height: 22px;
        outline: none;
        -webkit-appearance: none;
    }
    textarea:focus {
        border-color: #888;
    }
    .color-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
    }
    button {
        border: none;
        border-radius: 8px;
        height: 34px;
        min-height: 34px;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-appearance: none;
    }
    .color-button {
        width: 58px;
    }
    .control-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
        margin-bottom: 12px;
    }
    .control-button {
        background: #3a3a3a;
        color: white;
    }
    .sup-button,
    .sub-button {
        width: 44px;
    }
    .clear-button {
        width: 60px;
    }
    .copy-button {
        width: 120px;
    }
    .preview {
        width: 100%;
        height: 140px;
        border: 1px solid #666;
        border-radius: 8px;
        background: #333333;
        padding: 10px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        font-size: 16px;
        line-height: 24px;
        white-space: normal;
        overflow-wrap: anywhere;
        word-break: break-all;
    }
    .preview-line {
        min-height: 24px;
    }
    .preview-char {
        display: inline-block;
        white-space: pre;
        vertical-align: baseline;
    }
    .preview-char.sup {
        font-size: 12px;
        position: relative;
        top: -6px;
    }
    .preview-char.sub {
        font-size: 12px;
        position: relative;
        top: 4px;
    }
    .copy-status {
        height: 20px;
        margin-top: 4px;
        font-size: 13px;
        color: #cccccc;
        text-align: right;
    }
</style>
</head>
<body>
<div class="container">
<div class="label">テキスト入力</div>
<textarea id="inputText"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"></textarea>
<div class="color-buttons" id="colorButtons"></div>
<div class="control-buttons">
    <button class="control-button sup-button"
            id="supButton">up</button>
    <button class="control-button clear-button"
            id="supOffButton">up off</button>
    <button class="control-button sub-button"
            id="subButton">dn</button>
    <button class="control-button clear-button"
            id="subOffButton">dn off</button>
    <button class="control-button copy-button"
            id="copyButton">copy</button>
</div>
<div class="label">プレビュー</div>
<div class="preview" id="preview"></div>
<div class="copy-status" id="copyStatus"></div>
</div>
<script>
const SAMPLE_COLORS = [
    ['白', 'ffffff'],
    ['灰', '808080'],
    ['青', '0000ff'],
    ['赤', 'ff0000'],
    ['緑', '00aa00'],
    ['黄', 'ffd700'],
    ['紫', '800080'],
    ['水', '00ced1'],
    ['桃', 'ff69b4'],
    ['橙', 'ff8c00']
];
const WHITE = 'white';
const input = document.getElementById('inputText');
const preview = document.getElementById('preview');
const copyStatus = document.getElementById('copyStatus');
// ============================================================
// Pythonista版:
// to_chat_color_tag()
// ============================================================
function toChatColorTag(hex6) {
    let s = (hex6 || '')
        .trim()
        .replace('#', '');
    if (s.length !== 6) {
        return '';
    }
    s = s.toUpperCase();
    return `[${s[0]}[[#C0]-]${s.slice(1)}]`;
}
// ============================================================
// Pythonista版:
// 選択範囲取得
// ============================================================
function getSelection() {
    const text = input.value || '';
    let start = input.selectionStart;
    let end = input.selectionEnd;
    if (start === null || start === undefined) {
        start = text.length;
    }
    if (end === null || end === undefined) {
        end = text.length;
    }
    start = Math.max(0, Math.min(Number(start), text.length));
    end = Math.max(0, Math.min(Number(end), text.length));
    if (start > end) {
        [start, end] = [end, start];
    }
    return {
        text: text,
        start: start,
        end: end
    };
}
// ============================================================
// Pythonista版:
// replace_selection()
// ============================================================
function replaceSelection(replacement) {
    const selection = getSelection();
    const before = selection.text.slice(0, selection.start);
    const after = selection.text.slice(selection.end);
    input.value =
        before +
        replacement +
        after;
    const newPos =
        selection.start +
        replacement.length;
    input.focus();
    input.setSelectionRange(
        newPos,
        newPos
    );
    refreshPreview();
}
// ============================================================
// Pythonista版:
// wrap_selection()
// ============================================================
function wrapSelection(openTag, closeTag) {
    const selection = getSelection();
    if (selection.start === selection.end) {
        replaceSelection(openTag);
        return;
    }
    const selected =
        selection.text.slice(
            selection.start,
            selection.end
        );
    const replacement =
        openTag +
        selected +
        closeTag;
    replaceSelection(replacement);
}
// ============================================================
// 色ボタン
// ============================================================
function insertColorCode(hex) {
    const code =
        toChatColorTag(hex);
    if (code) {
        replaceSelection(code);
    }
}
// ============================================================
// SUP / SUB
// ============================================================
function toggleSup() {
    wrapSelection(
        '[SUP]',
        '[/SUP]'
    );
}
function toggleSupOff() {
    replaceSelection(
        '[/SUP]'
    );
}
function toggleSub() {
    wrapSelection(
        '[SUB]',
        '[/SUB]'
    );
}
function toggleSubOff() {
    replaceSelection(
        '[/SUB]'
    );
}
// ============================================================
// プレビュー解析
// Pythonista版 parse_preview() 相当
// ============================================================
function parsePreview(text) {
    text = text || '';
    const items = [];
    let i = 0;
    let currentColor = WHITE;
    let supDepth = 0;
    let subDepth = 0;
    while (i < text.length) {
        // ----------------------------
        // SUP開始
        // ----------------------------
        if (text.startsWith('[SUP]', i)) {
            supDepth++;
            i += 5;
            continue;
        }
        // ----------------------------
        // SUP終了
        // ----------------------------
        if (text.startsWith('[/SUP]', i)) {
            supDepth =
                Math.max(
                    0,
                    supDepth - 1
                );
            i += 6;
            continue;
        }
        // ----------------------------
        // SUB開始
        // ----------------------------
        if (text.startsWith('[SUB]', i)) {
            subDepth++;
            i += 5;
            continue;
        }
        // ----------------------------
        // SUB終了
        // ----------------------------
        if (text.startsWith('[/SUB]', i)) {
            subDepth =
                Math.max(
                    0,
                    subDepth - 1
                );
            i += 6;
            continue;
        }
        // ----------------------------
        // 色タグ
        // Pythonista版と同じ形式
        // ----------------------------
        if (
            i + 15 < text.length &&
            text[i] === '[' &&
            text.slice(i + 2, i + 8) === '[[#C0]' &&
            text.slice(i + 8, i + 10) === '-]' &&
            text[i + 15] === ']'
        ) {
            const first =
                text[i + 1];
            const last5 =
                text.slice(i + 10, i + 15);
            const hexChars =
                '0123456789ABCDEFabcdef';
            const validFirst =
                hexChars.includes(first);
            const validLast =
                last5.length === 5 &&
                [...last5].every(
                    c => hexChars.includes(c)
                );
            if (
                validFirst &&
                validLast
            ) {
                currentColor =
                    '#' +
                    (
                        first +
                        last5
                    ).toUpperCase();
                i += 16;
                continue;
            }
        }
        // ----------------------------
        // 通常 / SUP / SUB
        // ----------------------------
        let kind = 'normal';
        if (supDepth > 0) {
            kind = 'sup';
        } else if (subDepth > 0) {
            kind = 'sub';
        }
        items.push({
            char: text[i],
            color: currentColor,
            kind: kind
        });
        i++;
    }
    return items;
}
// ============================================================
// プレビュー描画
// ============================================================
function refreshPreview() {
    const text =
        input.value || '';
    const items =
        parsePreview(text);
    preview.innerHTML = '';
    let line =
        document.createElement('div');
    line.className =
        'preview-line';
    preview.appendChild(line);
    for (const item of items) {
        if (item.char === '\n') {
            line =
                document.createElement('div');
            line.className =
                'preview-line';
            preview.appendChild(line);
            continue;
        }
        const span =
            document.createElement('span');
        span.className =
            'preview-char ' +
            item.kind;
        span.textContent =
            item.char;
        span.style.color =
            item.color;
        line.appendChild(span);
    }
}
// ============================================================
// 色ボタン生成
// ============================================================
function createColorButtons() {
    const container =
        document.getElementById(
            'colorButtons'
        );
    for (
        const [title, code]
        of SAMPLE_COLORS
    ) {
        const button =
            document.createElement(
                'button'
            );
        button.className =
            'color-button';
        button.textContent =
            title;
        button.style.backgroundColor =
            '#' + code;
        if (
            ['白', '黄', '水', '桃']
                .includes(title)
        ) {
            button.style.color =
                'black';
        } else {
            button.style.color =
                'white';
        }
        button.addEventListener(
            'click',
            () => insertColorCode(code)
        );
        container.appendChild(button);
    }
}
// ============================================================
// コピー
// ============================================================
async function copyText() {
    const text =
        input.value || '';
    try {
        await navigator.clipboard.writeText(
            text
        );
        copyStatus.textContent =
            'コピーしました';
        setTimeout(
            () => {
                copyStatus.textContent = '';
            },
            1500
        );
    } catch (error) {
        // Clipboard APIが使用できない場合の
        // フォールバック
        try {
            const temp =
                document.createElement(
                    'textarea'
                );
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            copyStatus.textContent =
                'コピーしました';
            setTimeout(
                () => {
                    copyStatus.textContent = '';
                },
                1500
            );
        } catch (fallbackError) {
            copyStatus.textContent =
                'コピーできませんでした';
        }
    }
}
// ============================================================
// イベント
// ============================================================
input.addEventListener(
    'input',
    refreshPreview
);
document
    .getElementById('supButton')
    .addEventListener(
        'click',
        toggleSup
    );
document
    .getElementById('supOffButton')
    .addEventListener(
        'click',
        toggleSupOff
    );
document
    .getElementById('subButton')
    .addEventListener(
        'click',
        toggleSub
    );
document
    .getElementById('subOffButton')
    .addEventListener(
        'click',
        toggleSubOff
    );
document
    .getElementById('copyButton')
    .addEventListener(
        'click',
        copyText
    );
// ============================================================
// 初期化
// ============================================================
createColorButtons();
refreshPreview();
</script>
</body>
</html>
